<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel territorial · Metrix</title>
<meta name="description" content="Panel territorial de Metrix: priorización de secciones electorales para casas de enlace y propaganda.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#060606">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/app.css">
<script>
  // Tema guardado antes de pintar, para evitar el parpadeo (misma clave que el Dashboard Electoral).
  document.documentElement.dataset.theme = localStorage.getItem('db-theme') || 'dark';
</script>
</head>
<body>
<a class="skip" href="#main">Ir al contenido</a>

<header class="top-bar">
  <div class="top-bar-inner">
    <a class="brand-logo" href="#casas" aria-label="Metrix">
      <img class="brand-img brand-img-dark" src="assets/logo-oscuro.png" alt="Metrix" width="182" height="54">
      <img class="brand-img brand-img-light" src="assets/logo-claro.png" alt="Metrix" width="182" height="54">
    </a>
    <h1 class="dashboard-title">PANEL TERRITORIAL</h1>
    <nav class="tabs" role="tablist" aria-label="Secciones del panel">
      <button class="tab" role="tab" id="tab-casas" aria-controls="panel-casas" aria-selected="true">Casas</button>
      <button class="tab" role="tab" id="tab-propaganda" aria-controls="panel-propaganda" aria-selected="false" tabindex="-1">Propaganda</button>
      <button class="tab" role="tab" id="tab-factores" aria-controls="panel-factores" aria-selected="false" tabindex="-1">Factores</button>
    </nav>
    <div class="top-bar-actions">
      <span class="generado" id="generado"></span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Cambiar tema">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <section class="vista" id="panel-casas" role="tabpanel" aria-labelledby="tab-casas"></section>
  <section class="vista" id="panel-propaganda" role="tabpanel" aria-labelledby="tab-propaganda" hidden></section>
  <section class="vista vista-factores" id="panel-factores" role="tabpanel" aria-labelledby="tab-factores" hidden></section>
</main>

<noscript><p class="noscript">Este panel necesita JavaScript.</p></noscript>
<script src="datos.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
